<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d7cf0"/>
      <stop offset="0.55" stop-color="#63c0ff"/>
      <stop offset="1" stop-color="#ffe9a8"/>
    </linearGradient>
    <radialGradient id="burst" cx="0.62" cy="0.34" r="0.6">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fd35a"/>
      <stop offset="1" stop-color="#3f9c3a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7dbe2"/>
      <stop offset="1" stop-color="#9aa1ad"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="190"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="190" fill="#2d7cf0"/></g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#burst)"/>
    <!-- sun rays -->
    <g fill="#ffffff" opacity="0.16">
      <path d="M640 330 L1000 90 L1000 220Z"/><path d="M640 330 L1000 330 L1000 440Z"/>
      <path d="M640 330 L400 80 L520 70Z"/><path d="M640 330 L1000 520 L1000 620Z"/>
    </g>
    <!-- far hill + castle -->
    <path d="M100 700 Q330 600 520 660 T924 640 V924 H100Z" fill="#4fae48" stroke="#2a170f" stroke-width="0"/>
    <g stroke="#2a170f" stroke-width="20" stroke-linejoin="round" stroke-linecap="round">
      <rect x="720" y="470" width="170" height="250" fill="url(#stone)"/>
      <path d="M706 470 H904 V430 H872 V452 H846 V430 H814 V452 H788 V430 H756 V452 H730 V430 H706Z" fill="url(#stone)"/>
      <path d="M778 720 V640 Q805 600 832 640 V720Z" fill="#5a3a22"/>
      <path d="M798 430 V350" fill="none"/>
      <path d="M798 350 L870 372 L798 396Z" fill="#e0382b"/>
      <path d="M744 530 h22 M830 530 h22" fill="none" stroke-width="16"/>
    </g>
    <!-- near hill -->
    <path d="M40 760 Q300 690 520 740 T924 720 V990 H40Z" fill="url(#hill1)" stroke="#2a170f" stroke-width="20" stroke-linejoin="round"/>
    <!-- trajectory -->
    <path d="M430 560 Q560 150 660 290" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-dasharray="4 30" opacity="0.9"/>
    <!-- catapult -->
    <g stroke="#2a170f" stroke-width="22" stroke-linejoin="round" stroke-linecap="round">
      <!-- frame -->
      <path d="M170 790 L560 790 L520 720 L215 720Z" fill="#b5763a"/>
      <path d="M300 720 L350 560 M430 720 L380 560" fill="none" stroke-width="30" stroke="#8a5a2a"/>
      <path d="M300 720 L350 560 M430 720 L380 560" fill="none" stroke-width="12" stroke="#c58a4a"/>
      <!-- arm + bucket -->
      <path d="M300 640 L610 310" fill="none" stroke-width="46" stroke="#2a170f"/>
      <path d="M300 640 L610 310" fill="none" stroke-width="24" stroke="#d9a15a"/>
      <path d="M560 360 L690 318 L650 262 L534 310Z" fill="#8a5a2a"/>
      <!-- counterweight -->
      <rect x="236" y="640" width="90" height="100" rx="14" fill="#7d848c" transform="rotate(-12 281 690)"/>
      <!-- pivot -->
      <circle cx="365" cy="585" r="26" fill="#6a7480"/>
      <!-- wheels -->
      <circle cx="260" cy="795" r="68" fill="#8a5a2a"/>
      <circle cx="260" cy="795" r="22" fill="#c9ced6" stroke-width="14"/>
      <circle cx="500" cy="795" r="68" fill="#8a5a2a"/>
      <circle cx="500" cy="795" r="22" fill="#c9ced6" stroke-width="14"/>
    </g>
    <!-- flaming boulder -->
    <g stroke="#2a170f" stroke-width="20" stroke-linejoin="round" stroke-linecap="round">
      <path d="M620 240 C560 200 470 215 400 262 C450 268 470 285 478 306 C440 318 430 345 440 372 C490 340 520 345 548 380 C560 350 590 335 625 345Z" fill="#ff7a1c"/>
      <path d="M610 275 C560 250 510 262 470 292 C505 296 520 312 524 330 C550 318 575 318 600 335Z" fill="#ffd23a" stroke-width="12"/>
      <circle cx="690" cy="300" r="92" fill="#9aa1ad"/>
      <path d="M640 255 Q690 230 740 262" fill="none" stroke="#e6e9ee" stroke-width="22"/>
      <path d="M700 330 l30 -24 M668 346 l16 28" fill="none" stroke="#6a7480" stroke-width="14"/>
    </g>
    <!-- sparks -->
    <g fill="#fff6c8" stroke="#2a170f" stroke-width="8" stroke-linejoin="round">
      <path d="M850 250 l12 28 l28 12 l-28 12 l-12 28 l-12 -28 l-28 -12 l28 -12Z"/>
      <path d="M520 190 l8 18 l18 8 l-18 8 l-8 18 l-8 -18 l-18 -8 l18 -8Z"/>
    </g>
  </g>
</svg>
