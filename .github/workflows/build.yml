name: Build

# Builds Windows, macOS and Linux with ./export.sh. The repository root must be this project folder.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$TPL/"

      - name: Export all platforms
        env:
          MM_BUILD_NUMBER: ${{ github.run_number }}
        run: ./export.sh

      - name: Package one ZIP per platform
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          (cd build/windows && zip -q "../../dist/MedievalMadness-$VER-Windows.zip" MedievalMadness.exe)
          cp build/macos/MedievalMadness.zip "dist/MedievalMadness-$VER-macOS.zip"
          (cd build/linux && zip -q "../../dist/MedievalMadness-$VER-Linux.zip" MedievalMadness.x86_64)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: medieval-madness
          path: dist/
          if-no-files-found: error

      - name: Release notes from CHANGELOG.md
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          # export.sh wrote the build's version (major.minor.run_number) to VERSION
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER="$(tr -d '[:space:]' < VERSION)"; fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          # tag: the "## <version>" section of CHANGELOG.md (else "## Unreleased"); push to main: always "## Unreleased"
          # (CI run numbers collide with old, reconstructed version sections, so those must not be picked up there)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then HEADS="$VER Unreleased"; else HEADS="Unreleased"; fi
          for H in $HEADS; do
            awk -v v="$H" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > release_notes.md
            [ -s release_notes.md ] && break
          done
          if [ ! -s release_notes.md ]; then echo "Build $VER" > release_notes.md; fi
          cat release_notes.md

      - name: Release with binaries
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.VER }}
          body_path: release_notes.md
          files: dist/*.zip
