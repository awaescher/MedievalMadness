name: Build

# Builds Windows, macOS and Linux with ./export.sh. The repository root must be this project folder.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                  # release notes diff against the previous release tag

      - name: Install Godot and export templates
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$TPL/"

      - name: Export all platforms
        run: |
          # patch number = run number minus BUILD_BASE (the run number of the last major / minor bump), so 1.11 starts at 1.11.1
          export MM_BUILD_NUMBER=$(( ${{ github.run_number }} - $(tr -d '[:space:]' < BUILD_BASE) ))
          ./export.sh

      - name: Package one ZIP per platform
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          (cd build/windows && zip -q "../../dist/MedievalMadness-$VER-Windows-x64.zip" MedievalMadness.exe)
          cp build/macos/MedievalMadness.zip "dist/MedievalMadness-$VER-macOS-universal.zip"
          (cd build/linux && zip -q "../../dist/MedievalMadness-$VER-Linux-x64.zip" MedievalMadness)
          (cd build/windows-arm64 && zip -q "../../dist/MedievalMadness-$VER-Windows-arm64.zip" MedievalMadness.exe)
          (cd build/linux-arm64 && zip -q "../../dist/MedievalMadness-$VER-Linux-arm64.zip" MedievalMadness)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: medieval-madness
          path: dist/
          if-no-files-found: error

      - name: Release notes from CHANGELOG.md
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          # export.sh wrote the build's version (major.minor.run_number) to VERSION
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER="$(tr -d '[:space:]' < VERSION)"; fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          # Release text = what is NEW compared with the previous release: the lines of the sections "Unreleased" and
          # "<major>.<minor>.0" of CHANGELOG.md that the previous release tag does not contain anywhere in its CHANGELOG.md.
          # (The first build of a new minor version therefore shows everything of that version, later builds only their delta.)
          MINOR0="$(echo "$VER" | cut -d. -f1,2).0"
          awk -v a="Unreleased" -v b="$MINOR0" '/^## /{p = ($2 == a || $2 == b); next} p' CHANGELOG.md | grep -v '^[[:space:]]*$' > current_notes.md || true
          PREV="$(git tag --list 'v*' --sort=-v:refname | grep -vx "v$VER" | head -1 || true)"
          echo "previous release tag: ${PREV:-none}"
          if [ -n "$PREV" ] && git show "$PREV:CHANGELOG.md" > old_changelog.md 2>/dev/null; then :; else : > old_changelog.md; fi
          # keep the entries ("- ...") that are not in the old file; category headings ("**New**") only when an entry follows
          awk 'NR==FNR { old[$0]=1; next } /^\*\*.*\*\*$/ { h=$0; next } /^- / { if (!($0 in old)) { if (h != "") { print h; h="" } print } }' old_changelog.md current_notes.md > release_body.md || true
          if [ ! -s release_body.md ]; then echo "Build $VER" > release_body.md; fi
          cat release_body.md

      - name: Release with binaries
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.VER }}
          body_path: release_body.md
          files: dist/*.zip
